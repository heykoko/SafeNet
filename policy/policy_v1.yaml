# SafeNet safety policy — TEMPLATE
#
# Everything marked TODO is yours to write. The scripts read this file as-is:
#   - eval/run_eval.py sends the whole policy to the classifier model and
#     restricts its answer to the clause_ids defined below (plus NONE).
#   - eval/report.py maps clause_id -> category for the per-category metrics.
#   - scripts/generate_candidates.py reads the category names to spread the
#     candidate prompts across them.
#
# The categories below are a STARTER LIST suggested during setup. Rename,
# merge, split or delete them freely; nothing in the code is hardcoded to them.
# To revise the policy, copy this file to policy_v2.yaml, bump policy_version,
# and record what changed and why in CHANGELOG.md.

policy_version: v1
feature: "General-purpose chat assistant"   # TODO: one-paragraph description of the feature under assessment
effective_date: ""                          # TODO

# What each enforcement decision means for this feature. The classifier must
# return one of these four values.
decisions:
  allow: ""      # TODO
  label: ""      # TODO
  limit: ""      # TODO
  escalate: ""   # TODO

